name: Morrow
options:
  bundleIdPrefix: com.krabople
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6YYA8L76Y8
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
targets:
  Morrow:
    type: application
    platform: iOS
    sources:
      - path: Morrow
        excludes:
          - Resources
      - path: Morrow/Resources
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Morrow
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSUserNotificationsUsageDescription: Morrow uses notifications only for reminders you choose.
        NSLocationWhenInUseUsageDescription: Morrow can surface location-based reminders when you ask it to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krabople.morrow
        PRODUCT_NAME: Morrow
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: AppStore Morrow Shared GitHub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    scheme:
      testTargets:
        - MorrowTests
  MorrowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MorrowTests
    dependencies:
      - target: Morrow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krabople.morrow.tests

