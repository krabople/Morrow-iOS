name: Listello
options:
  bundleIdPrefix: com.krabople
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6YYA8L76Y8
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 1.3.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
targets:
  Listello:
    type: application
    platform: iOS
    sources:
      - path: Listello
        excludes:
          - Resources
      - path: Listello/Resources
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Listello
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSUserNotificationsUsageDescription: Listello sends notifications only for tasks and days you choose.
        NSCalendarsFullAccessUsageDescription: Listello uses calendar access only when you choose to show or export calendar events.
        NSRemindersFullAccessUsageDescription: Listello uses Reminders access only when you choose to import lists.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krabople.morrow
        PRODUCT_NAME: Listello
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: AppStore Morrow Shared GitHub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    scheme:
      testTargets:
        - ListelloTests
  ListelloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ListelloTests
    dependencies:
      - target: Listello
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krabople.listello.tests
