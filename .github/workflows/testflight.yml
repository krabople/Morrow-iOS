name: Build and upload Quiet List to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: 6YYA8L76Y8
      APP_BUNDLE_ID: com.krabople.morrow

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Validate release secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate release app icon
        run: swift Support/generate-icon.swift Artwork/QuietListSource.jpg QuietList/Resources/Assets.xcassets/AppIcon.appiconset/QuietListIcon-1024.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Apple distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install App Store provisioning profile
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          ruby <<'RUBY'
          require "base64"
          require "fileutils"
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          def base64url(v) = Base64.urlsafe_encode64(v).delete("=")
          def fixed_width(v) = [v.to_i.to_s(16).rjust(64,"0")].pack("H*")

          now = Time.now.to_i
          h = base64url({alg:"ES256",kid:ENV["APPSTORE_KEY_ID"],typ:"JWT"}.to_json)
          p = base64url({iss:ENV["APPSTORE_ISSUER_ID"],iat:now,exp:now+900,aud:"appstoreconnect-v1"}.to_json)
          ut = "#{h}.#{p}"
          key = OpenSSL::PKey.read(ENV["APPSTORE_PRIVATE_KEY"])
          sig = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(ut))
          parts = OpenSSL::ASN1.decode(sig).value
          token = "#{ut}.#{base64url(parts.map{|x|fixed_width(x.value)}.join)}"

          uri = URI("https://api.appstoreconnect.apple.com/v1/profiles?filter[profileType]=IOS_APP_STORE&include=bundleId&fields[profiles]=name,uuid,profileContent,profileState")
          req = Net::HTTP::Get.new(uri)
          req["Authorization"] = "Bearer #{token}"
          resp = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true){|h|h.request(req)}
          profiles = JSON.parse(resp.body)["data"]
          profile = profiles.find{|p| p["attributes"]["name"].include?("Morrow")}
          abort "No Morrow profile found" unless profile

          puts "Profile: #{profile["attributes"]["name"]} (#{profile["attributes"]["uuid"]})"
          content = profile.dig("attributes","profileContent")
          unless content
            detail_uri = URI("https://api.appstoreconnect.apple.com/v1/profiles/#{profile["id"]}?fields[profiles]=name,uuid,profileContent")
            dreq = Net::HTTP::Get.new(detail_uri)
            dreq["Authorization"] = "Bearer #{token}"
            dresp = Net::HTTP.start(detail_uri.hostname, detail_uri.port, use_ssl: true){|h|h.request(dreq)}
            content = JSON.parse(dresp.body).dig("data","attributes","profileContent")
          end

          dir = File.expand_path("~/Library/MobileDevice/Provisioning Profiles")
          FileUtils.mkdir_p(dir)
          path = File.join(dir, "#{profile["attributes"]["uuid"]}.mobileprovision")
          File.binwrite(path, Base64.decode64(content))
          puts "Installed: #{path}"
          RUBY

      - name: Archive and export signed IPA
        id: build
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project QuietList.xcodeproj \
            -scheme QuietList \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath .build/Archives/QuietList.xcarchive \
            -derivedDataPath .build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="AppStore Morrow Shared GitHub" \
            DEVELOPMENT_TEAM=6YYA8L76Y8 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | xcbeautify --renderer github-actions

          xcodebuild -exportArchive \
            -archivePath .build/Archives/QuietList.xcarchive \
            -exportOptionsPlist Support/ExportOptions.plist \
            -exportPath .build/Export \
            | xcbeautify --renderer github-actions

          IPA_PATH=$(find .build/Export -name '*.ipa' -print -quit)
          echo "ipa-path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify packaged app icons
        run: |
          set -euo pipefail

          IPA_PATH="${{ steps.build.outputs.ipa-path }}"
          AUDIT_DIR=$(mktemp -d "$RUNNER_TEMP/quiet-list-ipa-audit.XXXXXX")
          unzip -q "$IPA_PATH" -d "$AUDIT_DIR"

          APP_BUNDLE=$(find "$AUDIT_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          INFO_PLIST="$APP_BUNDLE/Info.plist"

          echo "Packaged icon metadata:"
          plutil -p "$INFO_PLIST" | grep -E 'CFBundleIcon(Name|s|Files)|AppIcon'

          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$INFO_PLIST")
          if [ "$ICON_NAME" != "AppIcon" ]; then
            echo "Packaged CFBundleIconName is '$ICON_NAME', expected 'AppIcon'." >&2
            exit 1
          fi

          find_icon_with_size() {
            expected="$1"
            find "$APP_BUNDLE" -maxdepth 1 -type f -name '*.png' -print | while IFS= read -r icon; do
              width=$(sips -g pixelWidth "$icon" 2>/dev/null | awk '/pixelWidth/ {print $2}')
              height=$(sips -g pixelHeight "$icon" 2>/dev/null | awk '/pixelHeight/ {print $2}')
              if [ "$width" = "$expected" ] && [ "$height" = "$expected" ]; then
                echo "$icon"
              fi
            done
          }

          ICON_120=$(find_icon_with_size 120)
          ICON_152=$(find_icon_with_size 152)
          if [ -z "$ICON_120" ] || [ -z "$ICON_152" ]; then
            echo "Required packaged icons are missing (120x120: ${ICON_120:-missing}; 152x152: ${ICON_152:-missing})." >&2
            find "$APP_BUNDLE" -maxdepth 1 -type f -name '*.png' -print >&2
            exit 1
          fi

          echo "Verified 120x120 icon: $ICON_120"
          echo "Verified 152x152 icon: $ICON_152"

      - name: Keep signed IPA as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuietList-TestFlight-IPA
          path: ${{ steps.build.outputs.ipa-path }}
          if-no-files-found: error

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.build.outputs.ipa-path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          wait-for-processing: "false"

      - name: Confirm Apple processing completed
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APP_STORE_APP_ID: "6809041904"
          BUILD_NUMBER: ${{ github.run_number }}
        run: ruby Support/check-testflight.rb
