name: Localize Listello App Store listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_STORE_APP_ID: "6809041904"
      APP_STORE_VERSION: "1.3.0"
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate metadata
        run: |
          ruby -rjson -e 'JSON.parse(File.read("Support/store-localizations.json"))'
          ruby -c Support/update-store-localizations.rb

      - name: Update App Store localizations
        run: ruby Support/update-store-localizations.rb
