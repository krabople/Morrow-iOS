name: Capture localized iPad screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/localized-ipad-screenshots.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { language: ar, locale: ar_SA }
          - { language: de, locale: de_DE }
          - { language: es, locale: es_ES }
          - { language: fr, locale: fr_FR }
          - { language: hi, locale: hi_IN }
          - { language: id, locale: id_ID }
          - { language: it, locale: it_IT }
          - { language: ja, locale: ja_JP }
          - { language: ko, locale: ko_KR }
          - { language: nl, locale: nl_NL }
          - { language: pl, locale: pl_PL }
          - { language: pt-BR, locale: pt_BR }
          - { language: ru, locale: ru_RU }
          - { language: th, locale: th_TH }
          - { language: tr, locale: tr_TR }
          - { language: uk, locale: uk_UA }
          - { language: vi, locale: vi_VN }
          - { language: zh-Hans, locale: zh_CN }
          - { language: zh-Hant, locale: zh_TW }
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: swift Support/generate-icon.swift Artwork/ListelloSource.jpg Listello/Resources/Assets.xcassets/AppIcon.appiconset/ListelloIcon-1024.png
      - run: xcodegen generate
      - name: Select iPad simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for r in d["devices"].values() for x in r if x["name"].startswith("iPad Pro 13-inch")))')"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Capture screenshots
        id: screenshots
        continue-on-error: true
        env:
          LISTELLO_SCREENSHOT_LANGUAGE: ${{ matrix.language }}
          LISTELLO_SCREENSHOT_LOCALE: ${{ matrix.locale }}
        run: |
          set -uo pipefail
          TEST_STATUS=1
          for ATTEMPT in 1 2; do
            rm -rf LocalizedScreenshots.xcresult
            xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
            xcrun simctl boot "$SIMULATOR_ID"
            xcrun simctl bootstatus "$SIMULATOR_ID" -b
            xcodebuild test \
              -project Listello.xcodeproj \
              -scheme Listello \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -only-testing:ListelloUITests/ListelloLocalizedScreenshotUITests \
              -resultBundlePath LocalizedScreenshots.xcresult \
              CODE_SIGNING_ALLOWED=NO
            TEST_STATUS=$?
            if [ "$TEST_STATUS" -eq 0 ]; then break; fi
            echo "Capture attempt $ATTEMPT failed; restarting the simulator before retrying."
          done
          set -e
          mkdir -p captured
          if [ -d LocalizedScreenshots.xcresult ]; then
            xcrun xcresulttool export attachments --path LocalizedScreenshots.xcresult --output-path captured
          fi
          exit "$TEST_STATUS"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: localized-ipad-${{ matrix.language }}
          path: captured
          retention-days: 7
      - name: Fail if capture test failed
        if: steps.screenshots.outcome != 'success'
        run: exit 1

