name: Capture localized iPad screenshots

on:
  workflow_dispatch:
    inputs:
      language:
        description: App language code
        required: true
        default: de
      locale:
        description: Apple locale
        required: true
        default: de_DE

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: swift Support/generate-icon.swift Artwork/ListelloSource.jpg Listello/Resources/Assets.xcassets/AppIcon.appiconset/ListelloIcon-1024.png
      - run: xcodegen generate
      - name: Select iPad simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for r in d["devices"].values() for x in r if x["name"].startswith("iPad Pro 13-inch")))')"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Capture screenshots
        id: screenshots
        continue-on-error: true
        env:
          LISTELLO_SCREENSHOT_LANGUAGE: ${{ inputs.language }}
          LISTELLO_SCREENSHOT_LOCALE: ${{ inputs.locale }}
        run: |
          set -uo pipefail
          xcodebuild test \
            -project Listello.xcodeproj \
            -scheme Listello \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:ListelloUITests/ListelloLocalizedScreenshotUITests \
            -resultBundlePath LocalizedScreenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO
          TEST_STATUS=$?
          set -e
          mkdir -p captured
          xcrun xcresulttool export attachments --path LocalizedScreenshots.xcresult --output-path captured
          exit "$TEST_STATUS"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: localized-ipad-${{ inputs.language }}
          path: captured
          retention-days: 7
      - name: Fail if capture test failed
        if: steps.screenshots.outcome != 'success'
        run: exit 1
